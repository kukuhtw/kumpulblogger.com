name: ${COMPOSE_PROJECT_NAME:-myadnetwork}

services:
  web:
    build:
      context: .
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-myadnetwork}
      DB_PASSWORD: ${DB_PASSWORD:-myadnetwork}
      DB_DATABASE: ${DB_DATABASE:-myadnetwork}
      APP_NAME: ${APP_NAME:-MyAdNetwork}
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost:8080}
      KCE_APP_URL: ${KCE_APP_URL:-http://localhost:8080/kce}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/public_html/uploads
      - ai_images:/var/www/html/public_html/ai_images
      - banners:/var/www/html/public_html/banner_mini
      - voice:/var/www/html/public_html/voice
      - generated_json:/var/www/html/public_html/JSON

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-myadnetwork}
      MYSQL_USER: ${DB_USERNAME:-myadnetwork}
      MYSQL_PASSWORD: ${DB_PASSWORD:-myadnetwork}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "${DB_EXPOSED_PORT:-127.0.0.1:3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/myadnetwork_db_hanya_structure.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/kce_schema.sql:/docker-entrypoint-initdb.d/02-kce.sql:ro

volumes:
  mysql_data:
  uploads:
  ai_images:
  banners:
  voice:
  generated_json:
